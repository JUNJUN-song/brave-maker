<!DOCTYPE html>
<!--
  시작의 마을 스노우볼 · 게임(용사 키우기 | BRAVE MAKER) 첫 화면에 넣어 쓰는 방법

  1) 이 파일 하나가 전부다. 게임과 같은 곳에 village.html 같은 이름으로 두고 iframe 으로 넣는다.
       <iframe src="village.html#embed&time=auto" style="width:100%;height:100%;border:0"></iframe>

  2) 주소 뒤 # 다음에 설정을 & 로 이어 적는다(? 뒤에 적어도 된다).
       embed            제목과 아래 버튼을 숨기고 마을만 화면 가득 보여 준다
       optbtn=0         마을 안의 옵션 단추(▲ 옵션)를 숨긴다 — 게임 쪽 단추가 postMessage({ village: { options: 'toggle' } }) 로 옵션 줄을 펴고 접을 때
       lock             손가락으로 돌리거나 확대하지 못하게 한다(배경으로만 쓸 때)
       time=            auto 기기 시계에 맞춤(적지 않으면 이것) · dawn 새벽 · day 낮 · dusk 해질녘 · eve 저녁 · night 밤
                        자동일 때: 새벽 04~07 · 낮 07~18 · 해질녘 18~19 · 저녁 19~22 · 밤 22~04 (앱의 모험 장면과 같은 경계)
                        embed 모드에서는 아래 가운데 화살표 단추(▲ 옵션)를 누르면 옵션 줄이 펼쳐지고 다시 누르면 접힌다
       weather=         clear 맑음 · rain 비 · snow 눈
       hero=            male · female
       pet=             none · cat · dog
       follow=1         주인공을 가까이에서 따라가며 본다
       spin=1           천천히 자동 회전

  3) 실행 중에 바꿀 때는 iframe 에 메시지를 보낸다. 적은 것만 바뀐다.
       frame.contentWindow.postMessage({ village: { time: 'night', weather: 'snow', hero: 'female', pet: 'cat' } }, '*');
     embed 모드에서는 마을이 게임 쪽으로 알림을 보낸다.
       { village: 'ready' }          마을이 다 지어졌을 때
       { village: 'shootingStar' }   별똥별이 떨어질 때(소원 빌기 등에 쓴다)

  4) 같은 페이지 안에 코드를 합쳐 넣었다면 window.villageScene 을 바로 부른다.
       villageScene.configure({ time: 'dusk', weather: 'rain' })
       villageScene.onShootingStar = () => { ... }

  날씨는 이 페이지가 스스로 알아낼 수 없으니(외부 통신 없음) 게임이 알아낸 값을 위 방법으로 넘겨준다.
  글꼴은 앱과 같은 Galmuri(fonts/ 폴더), three.js 는 js/three.min.js 를 먼저 읽고 없을 때만 cdnjs 에서 불러온다.
  (2026-11-22 앱에 맞춰 고침: 원본은 art/source/village_2026-11-22/village_original.html)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시작의 마을 스노우볼</title>
<style>
/* 글꼴은 앱(용사 키우기)과 같은 Galmuri — 같은 폴더의 fonts/ 에서 읽는다 (밖에서 글꼴을 불러오지 않음, 2026-11-22) */
@font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Galmuri11'; font-weight: 700; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); font-display: swap; }
/* Layout: one screen. Title strip on top, the globe fills the middle, a row of controls sits at the bottom. */
:root{
  color-scheme: dark;
  --sky-top:#05060f;
  --sky-low:#12112c;
  --ink:#f3ecdd;
  --ink-dim:#a9a6c4;
  --glow:#ffc46b;
  --glow-deep:#c98a2b;
  --panel:#1b1d3f;
  --panel-edge:#3a3c70;
  --font-display:'Galmuri11','DungGeunMo','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --font-body:'Galmuri11','DungGeunMo','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
body.day{
  --sky-top:#8fc7e8; --sky-low:#d9efe0; --ink:#0d2c36; --ink-dim:#3a606c;
  --panel:#fbf7ee; --panel-edge:#c9bfa4; --glow:#ffc46b; --glow-deep:#c98a2b;
  color-scheme: light;
}
body.dawn{ --sky-top:#3e4c86; --sky-low:#f3bfa8; --bar:rgba(22,24,58,.62); }
body.night{ --sky-top:#000004; --sky-low:#04050f; }
body.dusk{ --sky-top:#2e2452; --sky-low:#ef8f55; --bar:rgba(22,18,48,.62); }
body.rain{ --veil:rgba(58,68,92,.5); }
body.snow{ --veil:rgba(214,222,236,.3); }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-low) 100%);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
}
.app{height:100%;display:flex;flex-direction:column;background:var(--veil,transparent)}
header{padding:14px 18px 0;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:13px;color:var(--ink-dim);letter-spacing:.04em}
h1{font-family:var(--font-display);font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.stage{flex:1;min-height:0;position:relative;outline:none}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--glow)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.grabbing{cursor:grabbing}
canvas.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
html.embed header,html.embed .controls,html.embed .hint.done{display:none}
html.lock canvas{pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:var(--ink-dim);pointer-events:none;padding:0 16px;transition:opacity .4s}
.fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6}
.controls{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;padding:8px 12px 12px;background:var(--bar,transparent)}
.group{display:flex;align-items:center;gap:6px}
.group span{font-size:14px;color:var(--ink-dim)}
button{
  font-family:var(--font-body);font-size:15px;color:var(--ink);
  background:var(--panel);border:1px solid var(--panel-edge);border-bottom-width:3px;
  border-radius:6px;min-height:38px;min-width:42px;padding:4px 11px;cursor:pointer;
}
button:hover{border-color:var(--glow-deep)}
button:active{transform:translateY(1px);border-bottom-width:2px}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
button[aria-pressed="true"]{background:var(--glow);color:#2a1c05;border-color:var(--glow-deep)}
/* 끼워 넣었을 때: 아래 가운데 화살표 단추로 옵션(시간·날씨·자동 회전·확대·주인공·애완동물·처음 시점)을 접었다 폈다 한다. 단추 모양은 앱과 같게(각진 픽셀 테두리) */
.tpick{position:absolute;left:0;right:0;bottom:6px;display:none;z-index:2;text-align:center;pointer-events:none}
html.embed .tpick{display:block}
html.nobtn .tpick{display:none}
html.embed.opts .controls{display:flex;background:#0a0920;border-top:4px solid #05041a;max-height:55%;overflow:auto}
html.embed .group span{color:#a9a2d6;font-size:12px;white-space:nowrap}
html.embed .controls{gap:4px 8px;padding:6px 6px 8px}
html.embed .group{gap:2px;flex-wrap:wrap;justify-content:center}
.tpick button,html.embed .controls button{
  font-family:var(--font-body);font-size:13px;line-height:1.2;color:#f4f0ff;background:#231d5a;
  border:0;border-radius:0;min-height:40px;min-width:44px;padding:6px 8px;margin:2px;cursor:pointer;pointer-events:auto;white-space:nowrap;
  box-shadow:0 -2px 0 0 #05041a,0 2px 0 0 #05041a,-2px 0 0 0 #05041a,2px 0 0 0 #05041a,inset 0 2px 0 0 rgba(255,255,255,.22),inset 0 -2px 0 0 rgba(0,0,0,.35);
}
.tpick button:active,html.embed .controls button:active{transform:translateY(1px)}
.tpick button:focus-visible,html.embed .controls button:focus-visible{outline:2px solid #ffd76a;outline-offset:2px}
html.embed .controls button[aria-pressed="true"]{background:#c99a2e;color:#1c1300;font-weight:700}
.tpick #tpBtn .arr{color:#ffd76a;margin-right:6px}
</style>
</head>
<body>
<script>/* 끼워 넣기 설정은 화면을 그리기 전에 읽어, 제목과 버튼이 잠깐이라도 비치지 않게 한다 */
(function(){var s='&'+(location.search||'').slice(1)+'&'+(location.hash||'').slice(1)+'&',d=document.documentElement;if(/&(embed|ui=0)&/.test(s))d.classList.add('embed');if(/&lock(=1)?&/.test(s))d.classList.add('lock');if(/&optbtn=0&/.test(s))d.classList.add('nobtn');})();
</script>
<div class="app">
  <header>
    <div class="eyebrow">BRAVE MAKER · 저녁</div>
    <h1>시작의 마을</h1>
  </header>

  <div class="stage" id="stage" tabindex="0" role="img" aria-label="유리 돔 안에 든 복셀 마을. 왼쪽 언덕에 오래된 벚나무가 서 있고 가운데 광장에 성녀상이 있습니다. 화살표 키로 돌리고, 더하기와 빼기 키로 확대하고, W A S D 키로 이동합니다.">
    <canvas id="view"></canvas>
    <div class="hint" id="hint">마을을 짓는 중이에요…</div>
    <div class="fail" id="fail">3D 화면을 열지 못했어요.<br>브라우저에서 WebGL을 켜고 다시 열어 주세요.</div>
    <div class="tpick" id="tpick">
      <button id="tpBtn" aria-expanded="false" aria-controls="controls"><span class="arr" id="tpArr" aria-hidden="true">▲</span><span id="tpNow">옵션</span></button>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="group"><span>시간</span><button id="btn-auto" aria-pressed="false">자동</button><button id="btn-dawn" aria-pressed="false">새벽</button><button id="btn-day" aria-pressed="false">낮</button><button id="btn-dusk" aria-pressed="false">해질녘</button><button id="btn-eve" aria-pressed="true">저녁</button><button id="btn-night" aria-pressed="false">밤</button></div>
    <div class="group"><span>날씨</span><button id="btn-w-clear" aria-pressed="true">맑음</button><button id="btn-w-rain" aria-pressed="false">비</button><button id="btn-w-snow" aria-pressed="false">눈</button></div>
    <div class="group"><span>자동 회전</span><button id="btnSpin" aria-pressed="false">꺼짐</button></div>
    <div class="group"><span>확대</span><button id="btnOut" aria-label="축소">−</button><button id="btnIn" aria-label="확대">+</button></div>
    <div class="group"><span>주인공</span><button id="btn-h-male" aria-pressed="true">남자</button><button id="btn-h-female" aria-pressed="false">여자</button><button id="btnFollow" aria-pressed="false">따라가기</button></div>
    <div class="group"><span>애완동물</span><button id="btn-p-none" aria-pressed="false">없음</button><button id="btn-p-cat" aria-pressed="false">고양이</button><button id="btn-p-dog" aria-pressed="true">강아지</button></div>
    <button id="btnReset">처음 시점</button>
  </div>
</div>

<!-- three.js r128: 앱과 같은 곳의 js/three.min.js 를 먼저 읽고(인터넷 없이도 됨), 없으면 맨 아래 boot() 가 cdnjs 에서 읽는다 -->
<script src="js/three.min.js"></script>
<script>
//<model>
/* ---------- 1. 복셀 모델: 블록 위치와 색을 쌓는다 ---------- */
const R = 176;                      // 땅의 반지름(블록 수). 바깥 20%를 잘라 낸 크기
function buildVillage(){
  const V = new Map();              // 칸 번호 -> {x,y,z,c,glow,o}
  let SINK = V;
  const G = new Map();              // 땅 칸 번호 -> 종류: g 풀, p 길, w 물, s 흙
  const N = 2 * R + 1, gcol = new Uint32Array(N * N);              // 평평한 땅은 블록 대신 색 지도로 둔다
  const K = (x, y, z) => (x + 512) + (z + 512) * 1024 + (y + 16) * 1048576;
  const GK = (x, z) => (x + 512) + (z + 512) * 1024;
  let seed = 20261120;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[rnd() * a.length | 0];
  const ri = (a, b) => a + (rnd() * (b - a + 1) | 0);
  let ORG = null;                   // 속이 빈 덩어리의 중심. 안쪽을 향한 면은 그리지 않는다
  const set = (x, y, z, c, glow) => SINK.set(K(x, y, z), { x, y, z, c: typeof c === 'function' ? c() : c, glow: !!glow, o: ORG });
  const has = (x, y, z) => V.has(K(x, y, z));
  const box = (x0, y0, z0, w, h, d, c, glow) => { for (let x = x0; x < x0 + w; x++) for (let y = y0; y < y0 + h; y++) for (let z = z0; z < z0 + d; z++) set(x, y, z, c, glow); };
  const ball = (cx, cy, cz, r, c) => { const m = Math.ceil(r); cx = Math.round(cx); cy = Math.round(cy); cz = Math.round(cz); for (let x = -m; x <= m; x++) for (let y = -m; y <= m; y++) for (let z = -m; z <= m; z++) if (x * x + y * y + z * z <= r * r) set(cx + x, cy + y, cz + z, c); };
  const inDisc = (x, z, m) => x * x + z * z <= (R - m) * (R - m);
  const paint = (x, z, c, t) => { if (!inDisc(x, z, 0)) return; gcol[(z + R) * N + (x + R)] = c; if (t) G.set(GK(x, z), t); };
  const RAD = Math.PI / 180;

  // 색: 따뜻한 시골 마을
  const GRASS = [0x3f7a3a, 0x478541, 0x3a7036, 0x4f8c45], GRASS_LIGHT = [0x5a9a4a, 0x63a552], GRASS_DEEP = [0x33662f, 0x2f5e2c];
  const PATH = [0xb89a6a, 0xa98c5e, 0xc2a574], PAVE = [0x9c968c, 0xa69f94, 0x928c82], PLANK = [0x8a6a45, 0x7a5c3c, 0x94734c];
  const STONE = [0x8b8996, 0x7a7887, 0x9794a1], ROCK = [0x6f6d78, 0x62606c, 0x7b7984, 0x585662], MARBLE = [0xe8e6e0, 0xdedcd6, 0xf2f0ea];
  const WALL = [0xe9dcc0, 0xe2d3b3, 0xefe4cb], BARN = [0x9b4a35, 0x8e432f, 0xa3503a];
  const SOIL = [0x6b4a30, 0x5f412a, 0x74513a], WATER = [0x2f6fa8, 0x3579b4, 0x2b659c], SAND = [0xd3c08a, 0xc8b47c];
  const TIMBER = 0x5a3b28, DOOR = 0x3e2718, CREAM = 0xefe6d0, TRUNK = [0x5b3d26, 0x523622];
  const LEAF = [0x7fb850, 0x8fc65a, 0x74ad48, 0x9ad062], LEAF_TOP = [0xb4dc64, 0xc6e46c, 0xa6d45e], BUSH = [0x3f8040, 0x4a8f48, 0x377438];
  const PINE = [0x5a9a4c, 0x64a654, 0x529044], PINE_TIP = [0x9ccc5c, 0xb4d864];
  const BIRCH = [0xd8c840, 0xe2d24a, 0xcfc03a], BIRCH_TOP = [0xf0e25a, 0xf6ea70];
  const GOLD = [0xe0b838, 0xe8c444], GOLD_TOP = [0xf4d850, 0xf8e268], ROSE = [0xe58fb2, 0xd97fa6], ROSE_TOP = [0xf5a8c6, 0xf9c2d8];
  const WINDOW = [0xffd27a, 0xffbe55, 0xffe19c];
  const FLOWER = [0xf2d04b, 0xe86a8c, 0xf4f1e6, 0x9c7be0, 0xff8f5a, 0x6fb8f0];
  const ROOFS = [[0xa8402f, 0x953627], [0x3d6f8a, 0x345f77], [0xc47a2c, 0xb06c25], [0x4a4a5c, 0x3f3f50], [0x6b8f3a, 0x5d7d32], [0x8a4a7a, 0x7a406b]];
  const OLDBARK = [0x4a342c, 0x40302a, 0x553a30, 0x3a2a26], OLDMOSS = [0x55703a, 0x4a6434];
  const PETAL_TOP = [0xfff6d8, 0xfff0c4, 0xfdeebb, 0xfffbea], PETAL_MID = [0xf8e4a0, 0xf6dc94, 0xfae8b0], PETAL_LOW = [0xecd080, 0xe6c874, 0xf0d890];   // 아주 연한 황금빛 꽃
  const PASTEL = [0xc9a0ff, 0x9fd0ff, 0xff9fe0, 0xf0e0ff, 0xb8b8ff];
  const WARM = 0xffc070;

  // 땅 높이: 왼쪽에 고목이 선 나지막한 언덕
  const HILL = { x: -96, z: -10, r: 52, h: 11 };
  const hillF = th => 1 + 0.25 * Math.sin(2 * th + 2.4) + 0.16 * Math.sin(3 * th + 4.0) + 0.09 * Math.sin(5 * th + 1);   // 둘레가 들쭉날쭉한 언덕
  const Hf = (x, z) => { const dx = x - HILL.x, dz = z - HILL.z, d = Math.hypot(dx, dz) / hillF(Math.atan2(dz, dx)); if (d >= HILL.r) return 0; const s = 1 - (d / HILL.r) ** 2; return Math.max(0, Math.round(HILL.h * Math.pow(s, 1.5) + 3.2 * (noise(x / 11 + 3, z / 11 + 3) - 0.5) * Math.min(1, s * 3))); };
  const hash = (ix, iz) => { let h = Math.imul(ix * 374761393 + iz * 668265263, 1274126177); h ^= h >>> 13; return ((h >>> 0) % 1000) / 1000; };
  const noise = (x, z) => { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz); const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1); return a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz; };

  const blocked = new Set(), solid = new Set(), lamps = [], sparks = [];
  const lamp = (x, y, z, c, rad, power) => lamps.push([x, y, z, c, rad || 9, power || 1]);
  const block = (x0, z0, w, d, m) => { for (let x = x0 - m; x < x0 + w + m; x++) for (let z = z0 - m; z < z0 + d + m; z++) blocked.add(GK(x, z)); };
  const freeRect = (x0, z0, w, d, m) => { for (let x = x0 - m; x < x0 + w + m; x++) for (let z = z0 - m; z < z0 + d + m; z++) if (blocked.has(GK(x, z)) || !inDisc(x, z, 5) || Hf(x, z) > 0) return false; return true; };
  function placeNear(cx, cz, w, d, m) {
    for (let rad = 0; rad <= 30; rad++) for (let dx = -rad; dx <= rad; dx++) for (let dz = -rad; dz <= rad; dz++) {
      if (Math.max(Math.abs(dx), Math.abs(dz)) !== rad) continue;
      const x0 = cx - (w >> 1) + dx, z0 = cz - (d >> 1) + dz;
      if (freeRect(x0, z0, w, d, m)) return [x0, z0];
    }
    return null;
  }
  const doorFor = (cx, cz) => Math.abs(cx) > Math.abs(cz) ? (cx < 0 ? 'x+' : 'x-') : (cz < 0 ? 'z+' : 'z-');

  // 소품(등불, 벤치, 화단, 울타리, 풀꽃, 밭작물)은 반 칸짜리 고운 블록으로 직접 짓는다. 좌표는 마을 칸의 두 배
  const FX = [], farm = [];
